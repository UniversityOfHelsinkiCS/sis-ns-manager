apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sis-ns-manager
rules:
  - apiGroups:
      - image.openshift.io
    resources:
      - imagestreams
    verbs:
      - create
      - delete
      - patch
  - apiGroups:
      - build.openshift.io
    resources:
      - buildconfigs
    verbs:
      - create
      - delete
      - patch
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - create
      - delete
      - patch
