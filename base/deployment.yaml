apiVersion: apps/v1
kind: Deployment
metadata:
  name: sis-ns-manager
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"sis-ns-manager:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"sis-ns-manager\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sis-ns-manager
  template:
    metadata:
      labels:
        app: sis-ns-manager
    spec:
      serviceAccountName: manager
      containers:
        - name: sis-ns-manager
          # Seed value only: the image.openshift.io/triggers controller rewrites
          # this to the digest pullspec from the in-namespace ImageStream on each
          # build. Kept as a bare tag so no namespace is baked into base/.
          image: sis-ns-manager:latest
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
          envFrom:
            - secretRef:
                name: sis-ns-manager-secret
