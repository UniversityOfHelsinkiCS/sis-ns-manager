apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespaced parts of the namespace pruner. Referenced only by the prod overlay
# (the pruner runs in prod only). Cluster-scoped RBAC is in pruner/cluster/.
resources:
  - pruner-serviceaccount.yaml
  - pruner-build.yaml
  - pruner-cronjob.yaml
