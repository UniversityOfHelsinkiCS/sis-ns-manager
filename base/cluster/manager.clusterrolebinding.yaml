# Both bindings target the manager ServiceAccount. The subject namespace is
# PLACEHOLDER in base/ and replaced per environment by
# overlays/<env>/cluster/kustomization.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: manager-clusterrolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: manager-clusterrole
subjects:
- kind: ServiceAccount
  name: manager
  namespace: PLACEHOLDER
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: manager-self-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: self-provisioner
subjects:
- kind: ServiceAccount
  name: manager
  namespace: PLACEHOLDER
