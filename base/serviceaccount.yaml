apiVersion: v1
kind: ServiceAccount
metadata:
  name: manager
  namespace: sis-ns-manager
--- 
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: manager-clusterrolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: manager-clusterrole
subjects:
- kind: ServiceAccount
  name: manager
  namespace: sis-ns-manager
--- 
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-clusterrole
rules:
# Listing provisioned namespaces, reading one for the ownership check, and
# stamping our annotations. Creating projects comes from the self-provisioner
# binding below; creating role bindings comes from the per-project admin role
# the service account gets as the ProjectRequest requester.
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: manager-self-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: self-provisioner
subjects:
- kind: ServiceAccount
  name: manager
  namespace: sis-ns-manager