apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The only place a name prefix is applied. Cluster-scoped RBAC names are global,
# so prod- / staging- keeps the two instances from colliding on the cluster.
namePrefix: prod-

resources:
  - ../../../base/cluster
  - ../../../base/pruner/cluster

# namePrefix renames the ClusterRole/ClusterRoleBinding objects and rewrites
# roleRef, but Kustomize does not touch ClusterRoleBinding subjects[].namespace -
# so replace the base PLACEHOLDER here. The name regex matches the pre-prefix
# name (full-match anchored) and deliberately skips the sis-ns-manager binding,
# whose subject is the openshift-gitops controller.
patches:
  - target:
      kind: ClusterRoleBinding
      name: "(manager|pruner)-.*"
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: sis-ns-manager-prod
