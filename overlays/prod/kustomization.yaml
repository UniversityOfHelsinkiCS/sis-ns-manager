apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production instance. Synced by its own ArgoCD Application
# (destination namespace sis-ns-manager-prod, CreateNamespace=true).
namespace: sis-ns-manager-prod

resources:
  - ../../base
  - ../../base/pruner          # the namespace pruner runs in prod only
  - cluster                    # cluster-scoped RBAC, prefixed prod-

# Production builds track master (base defaults to test-clusters).
patches:
  - target:
      kind: BuildConfig
    patch: |-
      - op: replace
        path: /spec/source/git/ref
        value: master
